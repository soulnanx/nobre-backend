services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja
      POSTGRES_DB: loja
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: >
      sh -c "node dist/backend/src/db/migrate.js &&
             node dist/backend/src/db/seed.js &&
             node dist/backend/src/index.js"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://loja:loja@postgres:5432/loja
      POOL_SIZE: 10
      SESSION_TTL: 86400
      RATE_LIMIT_REGISTER: 5
      RATE_LIMIT_LOGIN: 10
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

volumes:
  postgres-data:
